spring:
  jpa:
    hibernate:
      # o schema vem das migrations do Flyway, nunca do Hibernate
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      chat: ollama
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:7b
        temperature: 0.2

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    context-path: /api

app:
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    root: WARN
    com.desafio.taskmanager: INFO
    org.flywaydb: INFO
    org.testcontainers: INFO