spring:
  application:
    name: ai-task-manager
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskmanager}
    username: ${DB_USERNAME:taskmanager}
    password: ${DB_PASSWORD:taskmanager}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      chat: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${AI_MODEL:qwen2.5:7b}
        temperature: 0.2

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    context-path: /api

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    timeout: ${AI_TIMEOUT:60s}
    max-retries: ${AI_MAX_RETRIES:1}
    max-subtasks: 10
    min-subtasks: 2
    max-estimated-hours: 200

# O default e INFO. DEBUG fica no profile dev (application-dev.yml): log verboso
# em todo ambiente polui a saida e mascara problema real.
# O traceId no pattern amarra a linha de log ao header X-Trace-Id e ao campo
# traceId do ProblemDetail que o TraceIdFilter gera por requisicao.
logging:
  level:
    root: INFO
    com.desafio.taskmanager: INFO
  pattern:
    level: "%5p [${spring.application.name:ai-task-manager},%X{traceId:--}]"