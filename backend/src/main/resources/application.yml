spring:
  application:
    name: ai-task-manager
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskmanager}
    username: ${DB_USERNAME:taskmanager}
    password: ${DB_PASSWORD:taskmanager}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      chat: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${AI_MODEL:qwen2.5:7b}
        temperature: 0.2

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    context-path: /api

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    # 180s: qwen2.5:7b em CPU e a primeira chamada passam de um minuto, o que
    # virava 502 na demonstracao (T-F06-08). O nginx do frontend aceita 300s.
    timeout: ${AI_TIMEOUT:180s}
    max-retries: ${AI_MAX_RETRIES:1}
    max-subtasks: 10
    min-subtasks: 2
    max-estimated-hours: 200
    # Limites do validador pos-LLM (T-F03-01): o titulo espelha o VARCHAR(200)
    # da migration V2 e a descricao, o maxLength do formulario do frontend.
    max-title-length: 200
    max-text-length: 5000
  assistant:
    # Limite de resultados das ferramentas somente-leitura do assistente (F04).
    max-tool-results: ${ASSISTANT_MAX_TOOL_RESULTS:10}
    # true registra as ferramentas como tool calling no provedor; false injeta
    # um contexto pre-montado no prompt (fallback para modelo que nao suporta).
    tool-calling: ${ASSISTANT_TOOL_CALLING:true}

# O default e INFO. DEBUG fica no profile dev (application-dev.yml): log verboso
# em todo ambiente polui a saida e mascara problema real.
# O traceId no pattern amarra a linha de log ao header X-Trace-Id e ao campo
# traceId do ProblemDetail que o TraceIdFilter gera por requisicao.
logging:
  level:
    root: INFO
    com.desafio.taskmanager: INFO
  pattern:
    level: "%5p [${spring.application.name:ai-task-manager},%X{traceId:--}]"